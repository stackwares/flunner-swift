name: Flunner
packages:
  SimulatorKeyboard:
    path: Packages/SimulatorKeyboard
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.11.2
  mcp-swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: "0.12.0"
targets:
  Flunner:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Flunner
        excludes:
          - Design/AppIconMaster.png
    dependencies:
      - package: SimulatorKeyboard
      - package: SwiftTerm
      - package: mcp-swift-sdk
        product: MCP
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.flunner.app
      DEVELOPMENT_TEAM: V8V5US964Z
      PRODUCT_NAME: Flunner
      INFOPLIST_FILE: Sources/Flunner/Info.plist
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      ENABLE_STRICT_CONCURRENCY: "YES"
      ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    entitlements:
      path: Sources/Flunner/Flunner.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected-read-write: true
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    scheme:
      testTargets:
        - FlunnerTests
      run:
        config: Debug
      archive:
        config: Release
      profile:
        config: Release
      analyze:
        config: Debug
  FlunnerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/FlunnerTests
    dependencies:
      - target: Flunner
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"
      ENABLE_STRICT_CONCURRENCY: "YES"
settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
